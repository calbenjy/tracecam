<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>TraceCam</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;overflow:hidden}
    #camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
    #overlay{position:fixed;left:50%;top:50%;max-width:100vw;max-height:100vh;transform:translate(-50%,-50%);transform-origin:center;pointer-events:none;user-select:none}
    .top{position:fixed;top:env(safe-area-inset-top,12px);left:0;right:0;padding:12px;display:flex;gap:10px;align-items:center;z-index:5}
    .spacer{flex:1}
    button,.filebtn{border:0;color:#fff;background:rgba(17,24,39,.84);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:11px 14px;font-weight:650;font-size:15px;backdrop-filter:blur(12px);box-shadow:0 4px 20px #0005}
    button:active,.filebtn:active{transform:scale(.97)}
    input[type=file]{display:none}
    #empty{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,390px);padding:26px;text-align:center;border-radius:24px;background:rgba(17,24,39,.88);backdrop-filter:blur(14px)}
    #empty h1{margin:0 0 8px;font-size:30px}
    #empty p{margin:0 0 18px;color:#d1d5db;line-height:1.4}
    #panel{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:15px;border-radius:22px;background:rgba(17,24,39,.9);backdrop-filter:blur(18px);border:1px solid #ffffff18}
    .row{display:flex;align-items:center;gap:10px;margin:7px 0}
    .row label{width:80px;font-size:13px;color:#d1d5db}
    input[type=range]{flex:1;accent-color:#fff}
    .value{width:42px;text-align:right;font-size:13px;color:#e5e7eb}
    .actions{display:flex;gap:8px;margin-top:10px}
    .actions button{flex:1}
    #locked{display:none;position:fixed;z-index:7;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:11px 14px;background:rgba(17,24,39,.9);border-radius:999px}
    #status{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);background:#111827dd;padding:8px 12px;border-radius:999px;font-size:13px;display:none}
    @media (orientation:landscape){#panel{max-width:520px;left:50%;right:auto;width:calc(100% - 24px);transform:translateX(-50%)}}
  </style>
</head>
<body>
  <video id="camera" autoplay playsinline muted></video>
  <img id="overlay" alt="" hidden>

  <div class="top" id="top">
    <label class="filebtn">📷 Choose picture<input id="picker" type="file" accept="image/*"></label>
    <div class="spacer"></div>
    <button id="torch" title="Flashlight">🔦</button>
    <button id="lock" title="Lock controls">🔓</button>
  </div>

  <div id="empty">
    <h1>TraceCam</h1>
    <p>Choose a picture, place your iPhone above your paper, and trace the image from the screen.</p>
    <label class="filebtn">Choose a picture<input id="picker2" type="file" accept="image/*"></label>
  </div>

  <div id="panel" hidden>
    <div class="row"><label>Opacity</label><input id="opacity" type="range" min="0.05" max="1" value="0.55" step="0.01"><span class="value" id="opacityV">55%</span></div>
    <div class="row"><label>Zoom</label><input id="zoom" type="range" min="0.3" max="2.5" value="1" step="0.01"><span class="value" id="zoomV">100%</span></div>
    <div class="row"><label>Rotate</label><input id="rotate" type="range" min="-180" max="180" value="0" step="1"><span class="value" id="rotateV">0°</span></div>
    <div class="actions">
      <button id="center">↺ Reset</button>
      <button id="hide">👁 Hide controls</button>
      <button id="new">＋ New picture</button>
    </div>
  </div>

  <div id="locked">🔒 Locked · tap lock above to unlock</div>
  <div id="status"></div>

<script>
const video=document.getElementById('camera');
const overlay=document.getElementById('overlay');
const panel=document.getElementById('panel');
const empty=document.getElementById('empty');
const top=document.getElementById('top');
const locked=document.getElementById('locked');
const status=document.getElementById('status');
const opacity=document.getElementById('opacity'), zoom=document.getElementById('zoom'), rotate=document.getElementById('rotate');

let stream=null, torch=false, isLocked=false, objectURL=null;

function showStatus(msg){
  status.textContent=msg; status.style.display='block';
  clearTimeout(showStatus.t); showStatus.t=setTimeout(()=>status.style.display='none',2200);
}
async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=stream;
  }catch(e){
    showStatus('Camera access was blocked. Allow Camera in Safari settings.');
  }
}
function apply(){
  overlay.style.opacity=opacity.value;
  overlay.style.transform=`translate(-50%,-50%) scale(${zoom.value}) rotate(${rotate.value}deg)`;
  document.getElementById('opacityV').textContent=Math.round(opacity.value*100)+'%';
  document.getElementById('zoomV').textContent=Math.round(zoom.value*100)+'%';
  document.getElementById('rotateV').textContent=rotate.value+'°';
}
function loadFile(file){
  if(!file)return;
  if(objectURL)URL.revokeObjectURL(objectURL);
  objectURL=URL.createObjectURL(file);
  overlay.src=objectURL; overlay.hidden=false;
  empty.style.display='none'; panel.hidden=false; apply();
}
function reset(){opacity.value=.55;zoom.value=1;rotate.value=0;apply()}
function setLocked(v){
  isLocked=v; lock.textContent=v?'🔒':'🔓'; panel.hidden=v; locked.style.display=v?'block':'none';
}
picker.onchange=e=>loadFile(e.target.files[0]);
picker2.onchange=e=>loadFile(e.target.files[0]);
document.getElementById('opacity').oninput=apply;
document.getElementById('zoom').oninput=apply;
document.getElementById('rotate').oninput=apply;
document.getElementById('center').onclick=reset;
document.getElementById('new').onclick=()=>{picker.click()};
document.getElementById('hide').onclick=()=>{top.style.display='none';panel.hidden=true;locked.style.display='block';showStatus('Controls hidden — tap the lock area to restore')};
document.getElementById('lock').onclick=()=>{setLocked(!isLocked); if(isLocked){top.style.display='flex'}};
locked.onclick=()=>{setLocked(false);top.style.display='flex';panel.hidden=false};
document.getElementById('torch').onclick=async()=>{
  const track=stream?.getVideoTracks()[0];
  if(!track || !track.getCapabilities || !track.getCapabilities().torch){showStatus('Flashlight is not available in this browser.');return}
  try{torch=!torch;await track.applyConstraints({advanced:[{torch}]});document.getElementById('torch').textContent=torch?'💡':'🔦'}catch(e){showStatus('Flashlight unavailable.')}
};
startCamera();
apply();
</script>
</body>
</html>
